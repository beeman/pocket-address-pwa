name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  cancel-in-progress: true
  group: android-apk

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOLANA_MOBILE_KEY_PASSWORD: ${{ secrets.SOLANA_MOBILE_KEY_PASSWORD }}
      SOLANA_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.SOLANA_MOBILE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          cache: gradle
          distribution: temurin
          java-version: '17'
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOLANA_MOBILE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" -a -n "$SOLANA_MOBILE_KEYSTORE_PASSWORD" -a -n "$SOLANA_MOBILE_KEY_PASSWORD" || { echo "::error::Missing SOLANA_MOBILE_KEYSTORE_BASE64, SOLANA_MOBILE_KEYSTORE_PASSWORD or SOLANA_MOBILE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        working-directory: shell
        # versionCode = run number so every CI build is installable over the previous one.
        run: ./gradlew assembleRelease -PSOLANA_MOBILE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" -PSOLANA_MOBILE_KEYSTORE_ALIAS=pocket-address-pwa -PSOLANA_MOBILE_VERSION_CODE="$GITHUB_RUN_NUMBER"
      - name: Upload to daily prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gradle writes app-release-unsigned.apk when signing inputs are missing, so this fails loudly instead.
          test -f shell/app/build/outputs/apk/release/app-release.apk
          DATE="$(date -u +%Y-%m-%d)"
          TAG="android-dev-$DATE"
          APK="pocket-address-pwa-$DATE-run-$GITHUB_RUN_NUMBER.apk"
          cp shell/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest=false --prerelease --target "$GITHUB_SHA" --title "Android dev $DATE" --notes "Web shell APK builds for $DATE, pointed at the live Pages site."
          gh release upload "$TAG" "$APK"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK" >> "$GITHUB_STEP_SUMMARY"
